<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#d8b56c" stroke-width="1.5"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#ecf2fa}.muted{fill:#9eacbc}.box{fill:#132030;stroke:#34465e;stroke-width:1.5}.line{fill:none;stroke:#d8b56c;stroke-width:2;marker-end:url(#arrow)}.gold{fill:#d8b56c}.label{font-size:18px}</style><rect width="100%" height="100%" fill="#0b121e"/><rect x="0" y="0" width="8" height="100%" fill="#d8b56c"/><text x="42" y="54" font-size="29" font-weight="700">Drei Laufzeitbereiche. Eine explizite Projektbindung.</text><text x="42" y="85" font-size="16" class="muted">Transport ist keine OS-Sandbox; Cloud-Workspace und Windows-Projekt bleiben unterschiedliche Orte.</text><rect class="box" x="45" y="150" width="330" height="220" rx="13"/><text x="65" y="184" font-size="20" font-weight="600">Arena-Agent-Workspace</text><text x="65" y="217" font-size="16" class="muted">Node-Client aus Connect-Capsule</text><text x="65" y="242" font-size="16" class="muted">Sitzung + Connect-ID + Projekt</text><text x="65" y="267" font-size="16" class="muted">Auftrag als verschlüsselte Datei</text><text x="65" y="292" font-size="16" class="muted">Kein eigener Windows-Zugriff</text><rect class="box" x="465" y="150" width="330" height="220" rx="13"/><text x="485" y="184" font-size="20" font-weight="600">Öffentliches Relay</text><text x="485" y="217" font-size="16" class="muted">Dateibasierter Briefkasten</text><text x="485" y="242" font-size="16" class="muted">AES-GCM-Nutzlasten</text><text x="485" y="267" font-size="16" class="muted">Jobs, Ergebnisse, Lebenszeichen</text><text x="485" y="292" font-size="16" class="muted">Verfügbarkeit nicht garantiert</text><rect class="box" x="885" y="150" width="330" height="220" rx="13"/><text x="905" y="184" font-size="20" font-weight="600">Windows / AXON RC30</text><text x="905" y="217" font-size="16" class="muted">WPF + WebView2</text><text x="905" y="242" font-size="16" class="muted">Ein BridgeHost je Tab</text><text x="905" y="267" font-size="16" class="muted">Pfad-, Job- und Bindungsprüfung</text><text x="905" y="292" font-size="16" class="muted">Ausführung mit Nutzerrechten</text><path class="line" d="M380 235L455 235"/><path class="line" d="M800 235L875 235"/><rect class="box" x="885" y="440" width="330" height="115" rx="13"/><text x="905" y="474" font-size="20" font-weight="600">Gewähltes Projekt</text><text x="905" y="507" font-size="16" class="muted">Dateien, Inbox, Sicherungen</text><path class="line" d="M1050 375L1050 430"/><rect class="box" x="45" y="440" width="750" height="115" rx="13"/><text x="65" y="474" font-size="20" font-weight="600">Die Grenze bleibt sichtbar</text><text x="65" y="507" font-size="16" class="muted">Connect setzt nur einen Entwurf ein. Der Nutzer sendet selbst.</text><text x="65" y="532" font-size="16" class="muted">Relayfehler oder ein altes Hello beweisen keinen frischen Chatkontakt.</text><text x="42" y="630" font-size="13" class="muted">ISAS · AXON RC30 — Dokumentationsgrafik, kein Laufzeitnachweis</text></svg>