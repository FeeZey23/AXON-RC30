<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#d8b56c" stroke-width="1.5"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#ecf2fa}.muted{fill:#9eacbc}.box{fill:#132030;stroke:#34465e;stroke-width:1.5}.line{fill:none;stroke:#d8b56c;stroke-width:2;marker-end:url(#arrow)}.gold{fill:#d8b56c}.label{font-size:18px}</style><rect width="100%" height="100%" fill="#0b121e"/><rect x="0" y="0" width="8" height="100%" fill="#d8b56c"/><text x="42" y="54" font-size="29" font-weight="700">Ein Tab besitzt seine eigene Welt</text><text x="42" y="85" font-size="16" class="muted">Eine Browsernavigation im selben Tab ist etwas anderes als der Wechsel zu einem anderen AXON-Tab.</text><rect class="box" x="45" y="140" width="360" height="285" rx="13"/><text x="65" y="174" font-size="20" font-weight="600">Tab A</text><text x="65" y="207" font-size="16" class="muted">Stabile UUID A</text><text x="65" y="232" font-size="16" class="muted">WebView2-Profil A</text><text x="65" y="257" font-size="16" class="muted">Projektordner A</text><text x="65" y="282" font-size="16" class="muted">Briefkasten / Schlüssel A</text><text x="65" y="307" font-size="16" class="muted">Journal / Logs / Panels A</text><text x="65" y="332" font-size="16" class="muted">Eigene Lifetime / Abbruchsignale</text><rect class="box" x="460" y="140" width="360" height="285" rx="13"/><text x="480" y="174" font-size="20" font-weight="600">Tab B</text><text x="480" y="207" font-size="16" class="muted">Stabile UUID B</text><text x="480" y="232" font-size="16" class="muted">WebView2-Profil B</text><text x="480" y="257" font-size="16" class="muted">Projektordner B</text><text x="480" y="282" font-size="16" class="muted">Briefkasten / Schlüssel B</text><text x="480" y="307" font-size="16" class="muted">Journal / Logs / Panels B</text><text x="480" y="332" font-size="16" class="muted">Eigene Lifetime / Abbruchsignale</text><rect class="box" x="875" y="140" width="360" height="285" rx="13"/><text x="895" y="174" font-size="20" font-weight="600">Gemeinsame Anwendung</text><text x="895" y="207" font-size="16" class="muted">WPF-Hauptfenster</text><text x="895" y="232" font-size="16" class="muted">Tabliste / Verlauf</text><text x="895" y="257" font-size="16" class="muted">UI-Ressourcen und Theme</text><text x="895" y="282" font-size="16" class="muted">AppSettingsStore</text><text x="895" y="307" font-size="16" class="muted">Einstellungen in LocalAppData</text><text x="895" y="332" font-size="16" class="muted">Keine Betriebssystem-Isolation</text><path d="M432 140V425" stroke="#d8b56c" stroke-dasharray="5 8"/><path d="M847 140V425" stroke="#d8b56c" stroke-dasharray="5 8"/><rect class="box" x="45" y="475" width="1190" height="100" rx="13"/><text x="65" y="509" font-size="20" font-weight="600">Wiederöffnen statt Identität verwerfen</text><text x="65" y="542" font-size="16" class="muted">Verlauf erhält die Tabkonfiguration. Dauerhaft entfernen ist eine andere, explizite Aktion.</text><text x="42" y="630" font-size="13" class="muted">ISAS · AXON RC30 — Dokumentationsgrafik, kein Laufzeitnachweis</text></svg>