<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#d8b56c" stroke-width="1.5"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#ecf2fa}.muted{fill:#9eacbc}.box{fill:#132030;stroke:#34465e;stroke-width:1.5}.line{fill:none;stroke:#d8b56c;stroke-width:2;marker-end:url(#arrow)}.gold{fill:#d8b56c}.label{font-size:18px}</style><rect width="100%" height="100%" fill="#0b121e"/><rect x="0" y="0" width="8" height="100%" fill="#d8b56c"/><text x="42" y="54" font-size="29" font-weight="700">Quellen, Installation und private Laufzeitdaten trennen</text><text x="42" y="85" font-size="16" class="muted">Nur der Quellbaum wird zu GitHub übertragen. Zugangsdaten, Profile und Arbeitsdateien bleiben lokal.</text><rect class="box" x="45" y="145" width="570" height="170" rx="13"/><text x="65" y="179" font-size="20" font-weight="600">Git-Projekt: AXON RC30 (by ISAS)</text><text x="65" y="212" font-size="16" class="muted">src/ · tests/ · scripts/ · installer/</text><text x="65" y="237" font-size="16" class="muted">README.md · PROJECT.OVERVIEW.md · docs/</text><text x="65" y="262" font-size="16" class="muted">Keine AppData, keine historischen Release-ZIPs</text><rect class="box" x="665" y="145" width="570" height="170" rx="13"/><text x="685" y="179" font-size="20" font-weight="600">Programme: LocalAppData / Programs / ISAS</text><text x="685" y="212" font-size="16" class="muted">AXON-RC30 / AXON.RC30.exe</text><text x="685" y="237" font-size="16" class="muted">Assemblies, Runtime und Startmenüverknüpfung</text><text x="685" y="262" font-size="16" class="muted">MSI verwaltet die installierten Programmdateien</text><rect class="box" x="45" y="365" width="570" height="180" rx="13"/><text x="65" y="399" font-size="20" font-weight="600">Private AppData: LocalAppData / AXON / RC30</text><text x="65" y="432" font-size="16" class="muted">settings.json + .lastgood + optionale Vorwärts-Sicherung</text><text x="65" y="457" font-size="16" class="muted">Profiles/&lt;UUID&gt; · Sessions/&lt;UUID&gt;</text><text x="65" y="482" font-size="16" class="muted">Logs, Journal, Resume-Nachweis, lokale StateBackups</text><rect class="box" x="665" y="365" width="570" height="180" rx="13"/><text x="685" y="399" font-size="20" font-weight="600">Vom Nutzer gewählte Projektordner</text><text x="685" y="432" font-size="16" class="muted">Eigentliche Nutzdateien / Quellen</text><text x="685" y="457" font-size="16" class="muted">Inbox · Sicherungen · Konfliktmaterial</text><text x="685" y="482" font-size="16" class="muted">Weder Git-Quellbaum noch MSI-Payload</text><text x="42" y="630" font-size="13" class="muted">ISAS · AXON RC30 — Dokumentationsgrafik, kein Laufzeitnachweis</text></svg>